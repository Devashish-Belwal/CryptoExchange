name: Validate and Publish Docker Images

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
  NEXT_PUBLIC_CORE_WS_URL: ws://localhost:8083/ws
  NEXT_PUBLIC_DEBUG_URL: http://localhost:3000
  NEXT_PUBLIC_CORE_URL: http://localhost:3001
  NEXT_PUBLIC_DOCS_URL: http://localhost:3002

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Build workspace
        run: bun run build

  publish-images:
    name: Publish ${{ matrix.image_name }}
    needs: validate
    runs-on:
      ubuntu-latest

      # Do not push Docker images from pull requests.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: infra/docker/backend/Dockerfile
            image_name: cex-backend

          - service: trading-engine
            dockerfile: infra/docker/trade-engine/Dockerfile
            image_name: cex-trading-engine

          - service: database-engine
            dockerfile: infra/docker/database-engine/Dockerfile
            image_name: cex-database-engine

          - service: ws-server
            dockerfile: infra/docker/ws-server/Dockerfile
            image_name: cex-ws-server

          - service: ws-index-poller
            dockerfile: infra/docker/ws-poller/Dockerfile
            image_name: cex-ws-index-poller

          - service: proxy-server
            dockerfile: infra/docker/proxy/Dockerfile
            image_name: cex-proxy-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  deploy:
    name: Deploy to EC2
    needs: publish-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: infra/docker-compose.prod.yml
          target: opt/cex
          overwrite: true

      - name: Pull latest images and restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd opt/cex
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production pull
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            docker image prune -af --filter "until=24h"
