# create -  docker compose -f infra/docker-compose.dev.yml up -d

version: "3.8"

name: cex-dev

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cex
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  core-backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: dev-core-backend
    command: bun run --cwd apps/core-backend dev
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cex
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis

  core-trading-engine:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: dev-core-trading-engine
    command: bun run --cwd apps/core-trading-engine dev
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cex
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      - db
      - redis

  database-engine:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: dev-database-engine
    command: bun run --cwd apps/database-engine dev
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cex
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      - db
      - redis

  ws-server:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: dev-ws-server
    command: bun run --cwd apps/ws-server dev
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WS_PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      - redis

  ws-index-poller:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: dev-ws-index-poller
    command: bun run --cwd apps/ws-index-poller dev
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "8084"
    ports:
      - "8084:8084"
    depends_on:
      - redis

  proxy-server:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: dev-proxy-server
    command: bun run --cwd apps/proxy-server dev
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      PORT: "8085"
    ports:
      - "8085:8085"

volumes:
  pgdata:
  redisdata:
