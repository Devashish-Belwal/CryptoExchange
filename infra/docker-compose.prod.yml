# Production stack for a single EC2 host.
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d

name: cex-prod

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}

x-database-env: &database-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  backend:
    image: ${BACKEND_NAME:-cex-backend}:${IMAGE_TAG:-latest}
    container_name: cex-backend
    restart: always
    env_file:
      - ../.env.production
    environment:
      <<: [*database-env, *redis-env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/api/v1/alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 10s
    networks:
      - cex

  trading-engine:
    image: ${TRADE_ENGINE_NAME:-cex-trading-engine}:${IMAGE_TAG:-latest}
    container_name: cex-trading-engine
    restart: always
    env_file:
      - ../.env.production
    environment:
      <<: [*database-env, *redis-env]
      PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8081/alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 10s
    networks:
      - cex

  database-engine:
    image: ${DATABASE_ENGINE_NAME:-cex-database-engine}:${IMAGE_TAG:-latest}
    container_name: cex-database-engine
    restart: always
    env_file:
      - ../.env.production
    environment:
      <<: [*database-env, *redis-env]
      PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8082/alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 10s
    networks:
      - cex

  ws-server:
    image: ${WS_SERVER_NAME:-cex-ws-server}:${IMAGE_TAG:-latest}
    container_name: cex-ws-server
    restart: always
    env_file:
      - ../.env.production
    environment:
      <<: *redis-env
      WS_PORT: "8083"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8083/alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
    networks:
      - cex

  ws-index-poller:
    image: ${WS_POLLER_NAME:-cex-ws-index-poller}:${IMAGE_TAG:-latest}
    container_name: cex-ws-index-poller
    restart: always
    env_file:
      - ../.env.production
    environment:
      <<: *redis-env
      PORT: "8084"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8084/alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
    networks:
      - cex

  proxy-server:
    image: ${PROXY_SERVER_NAME:-cex-proxy-server}:${IMAGE_TAG:-latest}
    container_name: cex-proxy-server
    restart: always
    env_file:
      - ../.env.production
    environment:
      PORT: "8085"
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8085/alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
    networks:
      - cex

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: cex-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cex

  redis:
    image: redis:7.4-alpine
    container_name: cex-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cex

networks:
  cex:
    driver: bridge

volumes:
  pgdata:
  redisdata:
